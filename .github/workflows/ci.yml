name: ci
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the minimum supported; all three give identical sample results (see docs).
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy
      # Synthetic data only: CI never downloads the real datasets.
      - run: pytest -m "not real_data and not network"
        env:
          MOBILITYOPS_THREADS: "2"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # The generated API types must match the committed contract (also checked from Python).
      - run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    # Real Chromium against the built UI and a live API on the synthetic sample:
    # axe-core WCAG A/AA scans in light and dark mode, keyboard use, analyst, scenarios.
    runs-on: ubuntu-latest
    env:
      MOBILITYOPS_MODE: sample
      MOBILITYOPS_THREADS: "2"
      MOBILITYOPS_LOG_LEVEL: ERROR
      # Absolute: the server is started from apps/web, the pipeline from the repo root.
      MOBILITYOPS_DATA_DIR: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: pip install -e .
      - name: Build the synthetic sample, models and artifacts
        run: |
          python -m mobilityops.cli sample
          python -m mobilityops.cli ingest
          python -m mobilityops.cli build
          python -m mobilityops.cli forecast-eval --no-oracle
          python -m mobilityops.cli forecast-train
          python -m mobilityops.cli anomalies
          python -m mobilityops.cli optimize-backtest --no-sensitivity
      - run: npm ci && npm run build
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Serve and test
        working-directory: apps/web
        run: |
          python -m mobilityops.cli serve --port 8000 > ../../serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/ready >/dev/null && break; sleep 1; done
          # Fail fast, with the API's own message, if the data did not load (instead of 16 timeouts).
          curl -sS http://127.0.0.1:8000/ready; echo
          curl -sSf http://127.0.0.1:8000/api/v1/meta >/dev/null
          E2E_BASE=http://127.0.0.1:8000 npx playwright test
      - if: failure()
        run: cat serve.log | tail -50
