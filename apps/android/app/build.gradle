plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.jayraj.mobilityops'
    compileSdk 34

    defaultConfig {
        applicationId 'com.jayraj.mobilityops'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '2.0.0'
    }

    // Release signing comes from the environment so no key or password is ever in the repository.
    // Without MOBILITYOPS_KEYSTORE the release build is produced unsigned.
    def keystorePath = System.getenv('MOBILITYOPS_KEYSTORE')
    signingConfigs {
        if (keystorePath) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('MOBILITYOPS_KEYSTORE_PASSWORD')
                keyAlias System.getenv('MOBILITYOPS_KEY_ALIAS') ?: 'mobilityops'
                keyPassword System.getenv('MOBILITYOPS_KEY_PASSWORD') ?: System.getenv('MOBILITYOPS_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePath) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError true
        warningsAsErrors false
    }

    testOptions {
        unitTests.returnDefaultValues = false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
