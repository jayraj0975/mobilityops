# Render Blueprint for the public demo (free plan). The service in use was created from these
# same settings; see docs/DEPLOYMENT.md.
services:
  - type: web
    name: mobilityops
    runtime: docker
    plan: free
    region: oregon
    autoDeployTrigger: commit
    envVars:
      - key: DEMO_URL
        value: https://github.com/jayraj0975/mobilityops/releases/download/demo-data-v4/mobilityops-demo-real.tar.gz
      - key: DEMO_SHA256
        value: bcd1f63cb518ba4fe64fa8a956777ae80c530ce2e7b5d02e00b71442ebd46aab
      - key: MOBILITYOPS_MODE
        value: real
      - key: MOBILITYOPS_DEMO_NOTICE
        value: "Portfolio demo on a free hosting plan: it sleeps after about 15 minutes without visitors, so the first load can take about 30 seconds and the live feeds only run while it is awake."
      - key: MOBILITYOPS_ALLOW_UNAUTHENTICATED
        value: "true" # a deliberately public demo of aggregate data; the image refuses to start without a key otherwise
      - key: MOBILITYOPS_RATE_LIMIT
        value: "120"
      - key: MOBILITYOPS_RATE_LIMIT_HEAVY
        value: "12"
      - key: MOBILITYOPS_TRUST_PROXY
        value: "3" # measured: forged prefix, client, Cloudflare edge, Render load balancer
      - key: MOBILITYOPS_THREADS
        value: "1"
      - key: MOBILITYOPS_LIVE_MAX_STREAMS
        value: "8" # the Live tab is capped at 8 concurrent viewers on the small instance
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: PORT
        value: "8000"

  # The Pune console. Free web services have no background workers, so the ingestion worker runs on a
  # thread inside the API process (MOBILITYOPS_WITH_WORKER); in a normal deployment it is its own
  # process (docs/PRODUCTION.md). Demand is SIMULATED; the bundle is baked in at build time.
  - type: web
    name: mobilityops-pune
    runtime: docker
    plan: free
    region: oregon
    autoDeployTrigger: commit
    envVars:
      - key: DEMO_URL
        value: https://github.com/jayraj0975/mobilityops/releases/download/demo-data-pune-v2/mobilityops-demo-pune.tar.gz
      - key: DEMO_SHA256
        value: a5437c9ac8c460044876da0fc41953976e15f95945dbbf44d3f549a6c68158bd
      - key: MOBILITYOPS_MODE
        value: pune
      - key: MOBILITYOPS_DEMO_NOTICE
        value: "Portfolio demo on a free hosting plan: it sleeps after about 15 minutes without visitors, so live processing runs only while it is awake. After a sleep the first load takes about 30 seconds and the newest values may be minutes old until the worker catches up."
      - key: MOBILITYOPS_ALLOW_UNAUTHENTICATED
        value: "true" # public demo (simulated demand, real weather); see docs/DEPLOYMENT.md
      - key: MOBILITYOPS_WITH_WORKER
        value: "true"
      - key: MOBILITYOPS_RATE_LIMIT
        value: "120"
      - key: MOBILITYOPS_RATE_LIMIT_HEAVY
        value: "12"
      - key: MOBILITYOPS_TRUST_PROXY
        value: "3"
      - key: MOBILITYOPS_THREADS
        value: "1"
      - key: MOBILITYOPS_LIVE_MAX_STREAMS
        value: "8"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: PORT
        value: "8000"
