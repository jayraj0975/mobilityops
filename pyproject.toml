[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mobilityops"
version = "0.2.0"
description = "Urban mobility demand forecasting, anomaly detection and decision support on public NYC TLC data"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.0",
    "pyarrow>=15",
    "pandas>=2.2",
    "numpy>=1.26",
    "lightgbm>=4.3",
    "scipy>=1.11",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "holidays>=0.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs",
    "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mobilityops.pune" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "real_data: needs the downloaded real TLC/NOAA data; skipped in CI",
    "network: needs internet access; skipped in CI",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = ["S101"]           # asserts are how pytest works

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
# Pipeline SQL is built only from server-controlled, escaped values (see sqlutil.quote_literal).
# User-facing code (api, ai, analytics) is NOT exempt and must use bound parameters.
"src/mobilityops/transform/**" = ["S608"]
"src/mobilityops/quality/**" = ["S608"]
# declarative tables (one fact per line; one intent rule per line) read better unwrapped
"src/mobilityops/analyst/tools.py" = ["E501"]
"src/mobilityops/analyst/planner.py" = ["E501"]
"src/mobilityops/analyst/benchmark_report.py" = ["E501"]  # Markdown prose

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
files = ["src"]
